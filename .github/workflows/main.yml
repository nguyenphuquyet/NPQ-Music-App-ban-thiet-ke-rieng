name: Build Unsigned NPQ Music iOS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Unsigned iOS App
        run: |
          flutter build ios --release --no-codesign

      - name: Package Runner.app into NPQ_Music.ipa
        run: |
          mkdir -p Payload
          # Sao chép file app hệ thống tạo ra vào thư mục đóng gói
          cp -r build/ios/iphoneos/Runner.app Payload/
          # Đóng gói thành file IPA tên NPQ_Music
          zip -r NPQ_Music.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NPQ_Music_Unsigned
          path: NPQ_Music.ipa
